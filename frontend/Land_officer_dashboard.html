<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }

</head>
<body class="bg-[#b8e3be] text-slate-900 antialiased min-h-screen">

  <!-- Mobile Overlay for Sidebar -->
  <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <div class="flex flex-col lg:flex-row min-h-screen p-3 md:p-6 gap-6 max-w-[1600px] mx-auto">

    <!-- Responsive Sidebar Navigation -->
    <aside id="sidebar" class="fixed lg:static top-0 left-0 h-full w-64 bg-white rounded-r-3xl lg:rounded-3xl p-6 flex flex-col justify-between shadow-xl lg:shadow-sm flex-shrink-0 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
      <div>
        <div class="flex items-center justify-between mb-8">
          <a href="#" class="inline-block focus:outline-none rounded-md">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">LandDeal</h1>
            <span class="text-[9px] font-bold text-green-700 tracking-wider block bg-green-100 px-2 py-0.5 rounded-full inline-block mt-0.5">
              Secure . Verified . Transparent
            </span>
          </a>
          <button onclick="toggleSidebar()" class="lg:hidden text-slate-500 hover:text-slate-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <nav aria-label="Officer Sidebar">
          <ul class="space-y-1.5">
            <li>
              <button onclick="filterByStatus('all')" class="w-full text-left flex items-center gap-3 px-4 py-2.5 text-slate-700 hover:bg-slate-100 hover:text-slate-900 font-semibold rounded-xl text-sm transition-all duration-200">
                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                <span>All Properties</span>
              </button>
            </li>

            <li class="pt-4 pb-1"><span class="px-4 text-xs font-semibold text-slate-500 tracking-wider">Verification</span></li>
            <li>
              <button onclick="filterByStatus('pending')" class="w-full text-left flex items-center gap-3 px-4 py-2.5 text-slate-900 font-bold bg-slate-100 hover:bg-amber-50 hover:text-amber-700 rounded-xl text-sm transition-all duration-200">
                <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span>Pending Requests</span>
              </button>
            </li>
            <li>
              <button onclick="filterByStatus('approved')" class="w-full text-left flex items-center gap-3 px-4 py-2.5 text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 font-semibold rounded-xl text-sm transition-all duration-200">
                <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span>Approved</span>

            </li>
            <li>
              <button onclick="filterByStatus('rejected')" class="w-full text-left flex items-center gap-3 px-4 py-2.5 text-slate-700 hover:bg-rose-50 hover:text-rose-700 font-semibold rounded-xl text-sm transition-all duration-200">

                <span>Rejected</span>
              </button>
            </li>
          </ul>
        </nav>
      </div>

      <!-- Logout Button with Hover -->
      <div class="pt-6 border-t border-slate-100">
        <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-red-600 hover:bg-rose-100 hover:text-rose-800 font-bold rounded-xl text-sm transition-all duration-200">

      </div>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 bg-white rounded-3xl p-4 md:p-8 shadow-sm flex flex-col justify-between overflow-hidden">
      <div>
        <!-- Top Bar -->
        <header class="flex justify-between items-center gap-4 mb-6">
          <div class="flex items-center gap-3">
            <button type="button" onclick="toggleSidebar()" aria-label="Toggle menu" class="lg:hidden text-slate-700 hover:text-slate-900 hover:bg-slate-200 p-2 rounded-xl bg-slate-100 transition-all duration-200">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
            <h2 class="text-xl md:text-2xl font-bold text-slate-900">
              Officer <span class="text-green-700">Dashboard</span>
            </h2>
          </div>

          <div class="flex items-center gap-4">
            <!-- Notifications Button -->
            <button type="button" aria-label="View notifications" class="p-2 text-gray-400 hover:text-green-600 rounded-full hover:bg-gray-100 transition-colors focus:outline-none focus:ring-2 focus:ring-green-600">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
            </button>

  <!-- Profile Button -->

<div class="relative" id="profile-dropdown-container">
  <button 
    onclick="toggleProfileDropdown(event)" 
    class="flex items-center gap-3 p-1 rounded-2xl hover:bg-slate-100 transition-all duration-200 focus:outline-none">
    <div class="text-right hidden sm:block">
      <div id="user_name" class="text-xs font-bold text-slate-900"> User</div>
    </div>
    <div 
      id="profile-avatar-ring" 
      class="w-10 h-10 rounded-full ring-2 ring-emerald-600/30 overflow-hidden flex items-center justify-center bg-slate-800 text-white shadow-sm transition-all duration-200">
    </div>
  </button>

  <div 
    id="profile-dropdown" 
    class="hidden absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-slate-100 p-4 z-50 transition-all duration-200 animate-in fade-in slide-in-from-top-2">
    
    <div class="pb-3 border-b border-slate-100">
      <p id="dropdown-user-name" class="text-sm font-bold text-slate-900">Officer Admin</p>
      <p id="dropdown-user-email" class="text-xs text-slate-500 truncate mt-0.5">officer@landdeal.gov.bd</p>
    </div>

    <div class="pt-2">
      <button 
        onclick="logout()" 
        class="w-full flex items-center gap-2 px-3 py-2 text-rose-600 hover:bg-rose-50 font-bold rounded-xl text-xs transition-colors duration-150">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </div>
</div>
          </div>
          </div>
        </header>

        <!-- Metric Overview Cards with Scale & Hover Effects -->
        <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
          <div class="border border-slate-200 p-4 rounded-2xl bg-amber-50/40 hover:bg-amber-100/60 hover:shadow-md transition-all duration-200 flex items-center gap-3 cursor-pointer">
            <div class="text-amber-600 flex-shrink-0"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>
            <div>
              <div id="metric-pending-count" class="text-xl sm:text-2xl font-bold text-slate-900">0</div>
              <div class="text-[11px] font-bold text-slate-700">Pending</div>
            </div>
          </div>

          <div class="border border-slate-200 p-4 rounded-2xl bg-emerald-50/40 hover:bg-emerald-100/60 hover:shadow-md transition-all duration-200 flex items-center gap-3 cursor-pointer">
            <div class="text-emerald-600 flex-shrink-0"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>
            <div>
              <div id="metric-approved-count" class="text-xl sm:text-2xl font-bold text-slate-900">0</div>
              <div class="text-[11px] font-bold text-slate-700">Approved</div>
            </div>
          </div>

          <div class="border border-slate-200 p-4 rounded-2xl bg-rose-50/40 hover:bg-rose-100/60 hover:shadow-md transition-all duration-200 flex items-center gap-3 cursor-pointer">
            <div class="text-rose-600 flex-shrink-0"><svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg></div>
            <div>
              <div id="metric-rejected-count" class="text-xl sm:text-2xl font-bold text-slate-900">0</div>
              <div class="text-[11px] font-bold text-slate-700">Rejected</div>
            </div>
          </div>

          <div class="border border-slate-200 p-4 rounded-2xl bg-slate-50 hover:bg-slate-100 hover:shadow-md transition-all duration-200 flex items-center gap-3 cursor-pointer">
            <div class="text-slate-500 flex-shrink-0"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg></div>
            <div>
              <div id="metric-total-count" class="text-xl sm:text-2xl font-bold text-slate-900">0</div>
              <div class="text-[11px] font-bold text-slate-700">Total Requests</div>
            </div>
          </div>
        </section>

        <!-- Search Bar -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-6">
          <h3 id="current-filter-title" class="text-lg font-bold text-slate-900">All Verification Requests</h3>
          <div class="relative w-full sm:w-72">
            <input type="text" id="land-search" placeholder="Search by name, RS/CS Plot..." class="w-full pl-9 pr-4 py-2 text-xs sm:text-sm text-slate-800 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent bg-white transition-all duration-200" />
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          </div>
        </div>

        <!-- Data Table -->
        <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-xs">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[650px]">
              <thead>
                <tr class="bg-slate-50 text-slate-700 font-bold text-xs uppercase tracking-wider border-b border-slate-200">
                  <th scope="col" class="py-3.5 px-4">Owner</th>
                  <th scope="col" class="py-3.5 px-4">Land Info</th>
                  <th scope="col" class="py-3.5 px-4">Date</th>
                  <th scope="col" class="py-3.5 px-4 text-center">Status</th>
                  <th scope="col" class="py-3.5 px-4 text-center">Action</th>
                </tr>
              </thead>
              <tbody id="properties-table-body" class="divide-y divide-slate-100 text-slate-900 text-sm">
                <!-- Rows Dynamic Inserted -->
              </tbody>

          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    
function toggleProfileDropdown(event) {
  event.stopPropagation();
  const dropdown = document.getElementById('profile-dropdown');
  dropdown.classList.toggle('hidden');
}

document.addEventListener('click', (e) => {
  const container = document.getElementById('profile-dropdown-container');
  const dropdown = document.getElementById('profile-dropdown');
  if (container && !container.contains(e.target)) {
    dropdown.classList.add('hidden');
  }
});



// Load User Data into Profile & Dropdown
const BACKEND_URL = 'http://localhost:5000'; 

async function loadUserProfile() {
  const avatarRing = document.getElementById('profile-avatar-ring');
  
  const token = sessionStorage.getItem('token');
  const defaultDarkUserIcon = `
    <svg class="w-6 h-6 text-slate-300" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
    </svg>
  `;

  let user = null;

  const userDataStr = sessionStorage.getItem('user');

  if (userDataStr) {
    try {
      user = JSON.parse(userDataStr);
    } catch (e) {
      console.error('Error parsing session user data:', e);
    }
  }

  if (!user && token) {
    try {
      const response = await fetch(`${BACKEND_URL}/api/auth/profile`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
      const result = await response.json();
      
      if (result.success) {
        user = result.user || result.data;
        if (user) {
          // API থেকে পাওয়ার পর sessionStorage-এ সেভ করা হচ্ছে
          sessionStorage.setItem('user', JSON.stringify(user));
        }
      }
    } catch (err) {
      console.error('Error fetching profile from API:', err);
    }
  }

  // DOM Elements
  const userNameEl = document.getElementById('user_name');
  const dropdownNameEl = document.getElementById('dropdown-user-name');
  const dropdownEmailEl = document.getElementById('dropdown-user-email');

  if (user) {
    const name = user.full_name || user.name || user.user_name || user.username || user.first_name || 'User';
    const email = user.email || 'user@landdeal.com';

    if (userNameEl) userNameEl.textContent = name;
    if (dropdownNameEl) dropdownNameEl.textContent = name;
    if (dropdownEmailEl) dropdownEmailEl.textContent = email;

    const userPic = user.profile_pic || user.avatar || user.image || user.profile_image;

    if (userPic && avatarRing) {
      let imgPath = userPic;
      if (!userPic.startsWith('http://') && !userPic.startsWith('https://')) {
        const cleanPath = userPic.startsWith('/') ? userPic : `/${userPic}`;
        imgPath = `${BACKEND_URL}${cleanPath.includes('/uploads') ? cleanPath : '/uploads/documents' + cleanPath}`;
      }

      avatarRing.innerHTML = `
        <img 
          src="${imgPath}" 
          alt="Profile" 
          class="w-full h-full object-cover rounded-full" 
          onerror="this.onerror=null; this.parentElement.innerHTML=\`${defaultDarkUserIcon.replace(/'/g, "\\'")}\`;" 
        />
      `;
    } else if (avatarRing) {
      avatarRing.innerHTML = defaultDarkUserIcon;
    }
  } else {
    if (userNameEl) userNameEl.textContent = 'Guest';
    if (dropdownNameEl) dropdownNameEl.textContent = 'Guest User';
    if (dropdownEmailEl) dropdownEmailEl.textContent = 'Not logged in';
    if (avatarRing) avatarRing.innerHTML = defaultDarkUserIcon;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadUserProfile();
});
    let currentFilter = 'all';

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('mobile-overlay').classList.toggle('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchDashboardMetrics();
      fetchProperties();

      document.getElementById('land-search').addEventListener('input', (e) => {
        fetchProperties(e.target.value.trim());
      });
    });

    async function fetchDashboardMetrics() {
      try {
        const token = localStorage.getItem('token');
        const res = await fetch('http://localhost:5000/api/properties/metrics', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('metric-pending-count').textContent = data.metrics.pending || 0;
          document.getElementById('metric-approved-count').textContent = data.metrics.approved || 0;
          document.getElementById('metric-rejected-count').textContent = data.metrics.rejected || 0;
          document.getElementById('metric-total-count').textContent = data.metrics.total || 0;
        }
      } catch (e) { console.error(e); }
    }

    async function fetchProperties(search = '') {
      const tableBody = document.getElementById('properties-table-body');
      try {
        const token = localStorage.getItem('token');
        let url = `http://localhost:5000/api/properties?status=${currentFilter}&search=${encodeURIComponent(search)}`;

        const response = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await response.json();

        if (!result.success || !result.data || result.data.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-500 font-medium">No land verification requests found.</td></tr>`;
          return;
        }

        tableBody.innerHTML = result.data.map(land => {
          const statusBadge = land.status === 'approved' 
            ? '<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">Approved</span>'
            : land.status === 'rejected'
            ? '<span class="bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded-full">Rejected</span>'
            : '<span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full">Pending</span>';

          return `
            <tr class="hover:bg-slate-50 transition-colors duration-150">
              <td class="py-3.5 px-4">
                <div class="font-bold text-slate-900">${land.owner_name || 'N/A'}</div>
                <div class="text-xs text-slate-500">${land.phone || 'No Phone'}</div>
              </td>
              <td class="py-3.5 px-4">
                <div class="font-bold text-slate-900">ID: LT-2026-${String(land.id).padStart(4, '0')}</div>
                <div class="text-xs text-slate-500">${land.mouza || ''}, ${land.upazila || ''}</div>
              </td>
              <td class="py-3.5 px-4 text-xs text-slate-600">
                ${new Date(land.created_at).toLocaleDateString()}
              </td>
              <td class="py-3.5 px-4 text-center">${statusBadge}</td>
              <td class="py-3.5 px-4 text-center">
                <!-- Redirects directly to property details page on click -->
                <button 
                  onclick="viewLandDetails(${land.id})" 
                  class="text-green-700 hover:text-white border border-green-600 hover:bg-green-600 shadow-xs hover:shadow px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all duration-200">
                  View Details
                </button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-red-500 font-medium">Error connecting to server.</td></tr>`;
      }
    }

    function filterByStatus(status) {
      currentFilter = status;
      document.getElementById('current-filter-title').textContent = `${status.toUpperCase()} Verification Requests`;
      fetchProperties();
    }

    function viewLandDetails(id) {
      window.location.href = `verification.html?id=${id}`;
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('registeredUser');
      window.location.href = 'login.html';
    }
  </script>
</body>
