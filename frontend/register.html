<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandDeal - Register</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#22C55E',
                        'dark-primary': '#16A34A',
                        'heading': '#111827',
                        'sub-text': '#4B5563',
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-white font-sans antialiased text-heading h-screen overflow-hidden">

    <div class="flex h-full w-full">
        <!-- Left Side: Registration Form Container -->
        <div class="w-full lg:w-[45%] h-full flex flex-col justify-between p-6 sm:p-8 xl:p-10 overflow-y-auto lg:overflow-visible">
            <div class="max-w-md w-full mx-auto my-auto py-2">
                
                <!-- Logo & Badge -->
                <div class="mb-4">
                    <h1 class="text-4xl font-black tracking-tight text-heading">LandDeal</h1>
                    <div class="mt-1.5 inline-flex items-center gap-1.5 px-3 py-0.5 bg-green-50 text-dark-primary text-xs font-semibold rounded-full border border-dark-primary">
                        <span class="w-1.5 h-1.5 rounded-full bg-dark-primary"></span>
                        Secure. Verified. Transparent
                    </div>
                </div>

                <!-- Page Header -->
                <h2 class="text-xl font-bold text-heading mb-0.5">Welcome Back</h2>
                <p class="text-xs text-sub-text mb-4">
                    Join LandDeal and start your journey to buy, sell or verify land
                </p>

                <!-- Registration Form -->
                <form class="space-y-3">
                    
                    <!-- Row 1: Name & Phone Number -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label for="full_name" class="block text-xs font-medium mb-1">Name</label>
                            <input type="text" id="full_name" name="full_name" placeholder="Full Name" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition" />
                        </div>
                        <div>
                            <label for="phone" class="block text-xs font-medium mb-1">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="Phone number" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition" />
                        </div>
                    </div>

                    <!-- Row 2: Email / Mobile No -->
                    <div>
                        <label for="email" class="block text-xs font-medium mb-1">Email Address/Mobile No</label>
                        <input type="text" id="email" name="email" placeholder="Enter your email/mobile no" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition" />
                    </div>

                    <!-- Row 3: Password -->
                    <div>
                        <label for="password" class="block text-xs font-medium mb-1">Password</label>
                        <div class="relative">
                            <input type="password" id="password" name="password" placeholder="Enter new Password" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition pr-10" />
                            <button type="button" onclick="toggleVisibility('password', 'eye-pass-show', 'eye-pass-hide')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-gray-600 transition focus:outline-none" aria-label="Toggle password visibility">
                                <svg id="eye-pass-show" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.573 16.49 16.638 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <svg id="eye-pass-hide" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L9.878 9.878" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Row 4: Confirm Password -->
                    <div>
                        <label for="confirm_password" class="block text-xs font-medium mb-1">Confirm Password</label>
                        <div class="relative">
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Your Password" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition pr-10" />
                            <button type="button" onclick="toggleVisibility('confirm_password', 'eye-cpass-show', 'eye-cpass-hide')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-gray-600 transition focus:outline-none" aria-label="Toggle confirm password visibility">
                                <svg id="eye-cpass-show" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.573 16.49 16.638 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <svg id="eye-cpass-hide" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L9.878 9.878" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Row 5: Role Selector Dropdown -->
                    <div>
                        <label for="role" class="block text-xs font-medium mb-1">Choose Your Role</label>
                        <div class="relative">
                            <select id="role" name="role" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs text-sub-text appearance-none focus:ring-1 focus:ring-primary focus:border-primary transition bg-white pr-8">
                                <option value="" disabled selected>I am a</option>
                                <option value="buyer">Buyer</option>
                                <option value="seller">Seller</option>
                                <option value="officer">Officer</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Row 6: Terms & Conditions Checkbox -->
                    <div class="flex items-center gap-2 pt-1">
                        <input type="checkbox" id="terms" name="terms" class="w-3.5 h-3.5 text-primary border-gray-300 rounded focus:ring-primary focus:ring-0 transition cursor-pointer" />
                        <label for="terms" class="text-xs text-sub-text cursor-pointer">
                            I agree to the <a href="#" class="text-dark-primary font-semibold hover:underline">Terms & Conditions</a> and <a href="#" class="text-dark-primary font-semibold hover:underline">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full py-2.5 px-4 text-center text-xs sm:text-sm font-bold rounded-lg bg-primary text-white shadow-sm transition hover:bg-dark-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-1 mt-2">
                        Create Account
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-3">
                    <div class="absolute inset-0 flex items-center" aria-hidden="true">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center">
                        <span class="bg-white px-3 text-xs text-sub-text">or continue with</span>
                    </div>
                </div>

                <!-- Footer Link -->
                <p class="text-xs text-center font-medium">
                    Already have an account? 
                    <a href="login.html" class="text-dark-primary font-semibold hover:text-primary transition">Login</a>
                </p>

            </div>
        </div>

        <!-- Right Side: Hero Cover Banner -->
        <div class="hidden lg:block lg:w-[55%] h-full relative ">
            <img src="/assets/images/login_page_image.jpg" alt="Aerial view of green land plots" class="absolute inset-0 w-full h-full object-cover">
            
            <div class="absolute inset-0 bg-black/35"></div>

        </div>
    </div>

    <!-- Script for Password Show/Hide Toggles -->
    <script>
        function toggleVisibility(inputId, showIconId, hideIconId) {
            const input = document.getElementById(inputId);
            const showIcon = document.getElementById(showIconId);
            const hideIcon = document.getElementById(hideIconId);

            if (input.type === 'password') {
                input.type = 'text';
                showIcon.classList.remove('hidden');
                hideIcon.classList.add('hidden');
            } else {
                input.type = 'password';
                showIcon.classList.add('hidden');
                hideIcon.classList.remove('hidden');
            }
        }
        document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
        full_name: document.getElementById('full_name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        confirm_password: document.getElementById('confirm_password').value,
        role: document.getElementById('role').value,
        terms: document.getElementById('terms').checked
    };

    try {
        const res = await fetch('http://localhost:5000/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
            alert(`Account Created! Your Unique ID is: ${data.data.userId}`);
            window.location.href = 'login.html';
        } else {
            alert(data.message);
        }
    } catch (err) {
        alert('Server error, try again later.');
    }
});
    </script>
</body>
</html>
