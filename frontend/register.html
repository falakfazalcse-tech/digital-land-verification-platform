<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandDeal - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#22C55E',
                        'dark-primary': '#16A34A',
                        'heading': '#111827',
                        'sub-text': '#4B5563',
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-white font-sans antialiased text-heading h-screen overflow-hidden">

    <div class="flex h-full w-full">
        <!-- Left Side: Registration Form Container -->
        <div class="w-full lg:w-[45%] h-full flex flex-col justify-between p-6 sm:p-8 xl:p-10 overflow-y-auto lg:overflow-visible">
            <div class="max-w-md w-full mx-auto my-auto py-2">
                
                <!-- Logo & Badge -->
                <div class="mb-4">
                    <h1 class="text-4xl font-black tracking-tight text-heading">LandDeal</h1>
                    <div class="mt-1.5 inline-flex items-center gap-1.5 px-3 py-0.5 bg-green-50 text-dark-primary text-xs font-semibold rounded-full border border-dark-primary">
                        <span class="w-1.5 h-1.5 rounded-full bg-dark-primary" aria-hidden="true"></span>
                        Secure. Verified. Transparent
                    </div>
                </div>

                <!-- Page Header -->
                <h2 class="text-xl font-bold text-heading mb-0.5">Welcome Back</h2>
                <p class="text-xs text-sub-text mb-4">
                    Join LandDeal and start your journey to buy, sell or verify land
                </p>

                <!-- General Alert Container -->
                <div id="general-error" class="hidden mb-3 p-2.5 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700 font-medium" role="alert" aria-live="assertive"></div>

                <!-- Registration Form -->
                <form id="registerForm" class="space-y-3" novalidate>
                    
                    <!-- Row 1: Name & Phone -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label for="full_name" class="block text-xs font-medium mb-1">Name <span class="text-red-500" aria-hidden="true">*</span></label>
                            <input type="text" id="full_name" name="full_name" placeholder="Full Name" required aria-required="true" aria-describedby="full_name-error" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition" />
                            <p id="full_name-error" class="text-[11px] text-red-600 mt-1 hidden" role="alert"></p>
                        </div>
                        <div>
                            <label for="phone" class="block text-xs font-medium mb-1">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="Phone number" aria-describedby="phone-error" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition" />
                            <p id="phone-error" class="text-[11px] text-red-600 mt-1 hidden" role="alert"></p>
                        </div>
                    </div>

                    <!-- Row 2: Email -->
                    <div>
                        <label for="email" class="block text-xs font-medium mb-1">Email Address <span class="text-red-500" aria-hidden="true">*</span></label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required aria-required="true" aria-describedby="email-error" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition" />
                        <p id="email-error" class="text-[11px] text-red-600 mt-1 hidden" role="alert"></p>
                    </div>

                    <!-- Row 3: Password -->
                    <div>
                        <label for="password" class="block text-xs font-medium mb-1">Password <span class="text-red-500" aria-hidden="true">*</span></label>
                        <div class="relative">
                            <input type="password" id="password" name="password" placeholder="Enter new Password" required aria-required="true" aria-describedby="password-error" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition pr-10" />
                            <button type="button" onclick="toggleBothPasswords('eye-pass-show', 'eye-pass-hide')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-gray-600 transition focus:outline-none" aria-label="Toggle password visibility">
                                <svg id="eye-pass-show" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.573 16.49 16.638 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <svg id="eye-pass-hide" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L9.878 9.878" />
                                </svg>
                            </button>
                        </div>
                        <p id="password-error" class="text-[11px] text-red-600 mt-1 hidden" role="alert"></p>
                    </div>

                    <!-- Row 4: Confirm Password -->
                    <div>
                        <label for="confirm_password" class="block text-xs font-medium mb-1">Confirm Password <span class="text-red-500" aria-hidden="true">*</span></label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Your Password" required aria-required="true" aria-describedby="confirm_password-error" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition" />
                        <p id="confirm_password-error" class="text-[11px] text-red-600 mt-1 hidden" role="alert"></p>
                    </div>

                    <!-- Row 5: Role Selector Dropdown -->
                    <div>
                        <label for="role" class="block text-xs font-medium mb-1">Choose Your Role <span class="text-red-500" aria-hidden="true">*</span></label>
                        <div class="relative">
                            <select id="role" name="role" required aria-required="true" aria-describedby="role-error" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs text-sub-text appearance-none focus:ring-1 focus:ring-primary focus:border-primary transition bg-white pr-8">
                                <option value="" disabled selected>I am a</option>
                                <option value="buyer">Buyer</option>
                                <option value="seller">Seller</option>
                                <option value="officer">Officer</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400" aria-hidden="true">
                                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                                </svg>
                            </div>
                        </div>
                        <p id="role-error" class="text-[11px] text-red-600 mt-1 hidden" role="alert"></p>
                    </div>

                    <!-- Row 6: Terms & Conditions Checkbox -->
                    <div class="pt-1">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="terms" name="terms" required aria-required="true" aria-describedby="terms-error" class="w-3.5 h-3.5 text-primary border-gray-300 rounded focus:ring-primary focus:ring-0 transition cursor-pointer" />
                            <label for="terms" class="text-xs text-sub-text cursor-pointer">
                                I agree to the <a href="#" class="text-dark-primary font-semibold hover:underline focus:outline-none focus:ring-1 focus:ring-primary">Terms & Conditions</a> and <a href="#" class="text-dark-primary font-semibold hover:underline focus:outline-none focus:ring-1 focus:ring-primary">Privacy Policy</a> <span class="text-red-500" aria-hidden="true">*</span>
                            </label>
                        </div>
                        <p id="terms-error" class="text-[11px] text-red-600 mt-1 hidden" role="alert"></p>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full py-2.5 px-4 text-center text-xs sm:text-sm font-bold rounded-lg bg-primary text-white shadow-sm transition hover:bg-dark-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-1 mt-2">
                        Create Account
                    </button>
                </form>

               
                <!-- Footer Link -->
                <p class="text-xs text-center p-4 font-medium">
                    Already have an account? 
                    <a href="login.html" class="text-dark-primary font-semibold hover:text-primary transition focus:outline-none focus:ring-1 focus:ring-primary">Login</a>
                </p>

            </div>
        </div>

        <!-- Right Side: Hero Cover Banner -->
        <div class="hidden lg:block lg:w-[55%] h-full relative">
            <img src="/assets/images/login_page_image.jpg" alt="Aerial view of green land plots" class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/35"></div>
        </div>
    </div>

    <!-- Script -->
    <script>
    function toggleBothPasswords(showIconId, hideIconId) {
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');
        
        const isPassword = passwordInput.type === 'password';
        const newType = isPassword ? 'text' : 'password';
        
        passwordInput.type = newType;
        confirmInput.type = newType;
        
        document.getElementById(showIconId).classList.toggle('hidden', !isPassword);
        document.getElementById(hideIconId).classList.toggle('hidden', isPassword);
    }

    function showError(inputId, message) {
        const input = document.getElementById(inputId);
        const errorEl = document.getElementById(`${inputId}-error`);
        
        if (input) {
            input.classList.add('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
            input.classList.remove('border-gray-300', 'focus:ring-primary', 'focus:border-primary');
            input.setAttribute('aria-invalid', 'true');
        }
        if (errorEl) {
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }
    }

    function clearError(inputId) {
        const input = document.getElementById(inputId);
        const errorEl = document.getElementById(`${inputId}-error`);
        
        if (input) {
            input.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
            input.classList.add('border-gray-300', 'focus:ring-primary', 'focus:border-primary');
            input.removeAttribute('aria-invalid');
        }
        if (errorEl) {
            errorEl.textContent = '';
            errorEl.classList.add('hidden');
        }
    }

    function clearAllErrors() {
        ['full_name', 'phone', 'email', 'password', 'confirm_password', 'role', 'terms'].forEach(clearError);
        const genError = document.getElementById('general-error');
        if (genError) {
            genError.textContent = '';
            genError.classList.add('hidden');
        }
    }

    ['full_name', 'email', 'password', 'confirm_password', 'role', 'terms'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('input', () => clearError(id));
            el.addEventListener('change', () => clearError(id));
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAllErrors();

        const fields = ['full_name', 'phone', 'email', 'password', 'confirm_password', 'role'];
        const values = Object.fromEntries(fields.map(id => [id, document.getElementById(id)?.value.trim() || '']));
        const terms = document.getElementById('terms').checked;

        let hasError = false;

        if (!values.full_name) { showError('full_name', 'Please enter your full name.'); hasError = true; }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!values.email) {
            showError('email', 'Email address is required.');
            hasError = true;
        } else if (!emailRegex.test(values.email)) {
            showError('email', 'Please enter a valid email address.');
            hasError = true;
        }

        if (!values.password) {
            showError('password', 'Password is required.');
            hasError = true;
        } else if (values.password.length < 6) {
            showError('password', 'Password must be at least 6 characters long.');
            hasError = true;
        }

        if (!values.confirm_password) {
            showError('confirm_password', 'Please confirm your password.');
            hasError = true;
        } else if (values.password !== values.confirm_password) {
            showError('confirm_password', 'Passwords do not match.');
            hasError = true;
        }

        if (!values.role) { showError('role', 'Please select a role (Buyer, Seller, or Officer).'); hasError = true; }
        if (!terms) { showError('terms', 'You must agree to the Terms & Conditions.'); hasError = true; }

        if (hasError) return;

        try {
            const response = await fetch('https://digital-land-verification-platform.onrender.com/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...values, terms })
            });

            const data = await response.json();

            if (data.success) {
                const token = data.token || (data.data && data.data.token);
            if (token) {
                localStorage.setItem('token', token);
            }
            
            localStorage.setItem('registeredUser', JSON.stringify(data.data));

            const userRole = (data.data?.role || values.role).toLowerCase();
            
            let targetPage = 'dashboard.html';
            if (userRole === 'officer') {
                targetPage = 'Land_officer_dashboard.html'; 
            }

            window.location.href = targetPage;
            } else {
                const msg = data.message?.toLowerCase() || '';
                if (msg.includes('email')) showError('email', data.message);
                else if (msg.includes('phone')) showError('phone', data.message);
                else {
                    const genError = document.getElementById('general-error');
                    if (genError) {
                        genError.textContent = data.message || 'Registration failed. Please check your information.';
                        genError.classList.remove('hidden');
                    }
                }
            }
        } catch (err) {
            console.error('Registration failed:', err);
            const genError = document.getElementById('general-error');
            if (genError) {
                genError.textContent = 'Unable to connect to the server. Please ensure the backend is running.';
                genError.classList.remove('hidden');
            }
        }
    });
    </script>
</body>
</html>
