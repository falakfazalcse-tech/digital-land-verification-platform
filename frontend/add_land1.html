function toggleProfileDropdown(event) {
  event.stopPropagation();
  const dropdown = document.getElementById('profile-dropdown');
  dropdown.classList.toggle('hidden');
}

document.addEventListener('click', (e) => {
  const container = document.getElementById('profile-dropdown-container');
  const dropdown = document.getElementById('profile-dropdown');
  if (container && !container.contains(e.target)) {
    dropdown.classList.add('hidden');
  }
});



const BACKEND_URL = 'https://digital-land-verification-platform-eight.vercel.app'; 

async function loadUserProfile() {
  const avatarRing = document.getElementById('profile-avatar-ring');
  
  const token = sessionStorage.getItem('token');
  const defaultDarkUserIcon = `
    <svg class="w-6 h-6 text-slate-300" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
    </svg>
  `;

  let user = null;

  const userDataStr = sessionStorage.getItem('user');

  if (userDataStr) {
    try {
      user = JSON.parse(userDataStr);
    } catch (e) {
      console.error('Error parsing session user data:', e);
    }
  }

  if (!user && token) {
    try {
      const response = await fetch(`${BACKEND_URL}/api/auth/profile`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
      const result = await response.json();
      
      if (result.success) {
        user = result.user || result.data;
        if (user) {
          sessionStorage.setItem('user', JSON.stringify(user));
        }
      }
    } catch (err) {
      console.error('Error fetching profile from API:', err);
    }
  }

  const userNameEl = document.getElementById('user_name');
  const dropdownNameEl = document.getElementById('dropdown-user-name');
  const dropdownEmailEl = document.getElementById('dropdown-user-email');

  if (user) {
    const name = user.full_name || user.name || user.user_name || user.username || user.first_name || 'User';
    const email = user.email || 'user@landdeal.com';

    if (userNameEl) userNameEl.textContent = name;
    if (dropdownNameEl) dropdownNameEl.textContent = name;
    if (dropdownEmailEl) dropdownEmailEl.textContent = email;

    const userPic = user.profile_pic || user.avatar || user.image || user.profile_image;

    if (userPic && avatarRing) {
      let imgPath = userPic;
      if (!userPic.startsWith('http://') && !userPic.startsWith('https://')) {
        const cleanPath = userPic.startsWith('/') ? userPic : `/${userPic}`;
        imgPath = `${BACKEND_URL}${cleanPath.includes('/uploads') ? cleanPath : '/uploads/documents' + cleanPath}`;
      }

      avatarRing.innerHTML = `
        <img 
          src="${imgPath}" 
          alt="Profile" 
          class="w-full h-full object-cover rounded-full" 
          onerror="this.onerror=null; this.parentElement.innerHTML=\`${defaultDarkUserIcon.replace(/'/g, "\\'")}\`;" 
        />
      `;
    } else if (avatarRing) {
      avatarRing.innerHTML = defaultDarkUserIcon;
    }
  } else {
    if (userNameEl) userNameEl.textContent = 'Guest';
    if (dropdownNameEl) dropdownNameEl.textContent = 'Guest User';
    if (dropdownEmailEl) dropdownEmailEl.textContent = 'Not logged in';
    if (avatarRing) avatarRing.innerHTML = defaultDarkUserIcon;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadUserProfile();
});
  const API_BASE = 'https://digital-land-verification-platform-eight.vercel.app/api/properties';

  // Sidebar Mobile Controls

    if (!token) {
      alert('You are not logged in! Please log in to post a property.');

    const savedDetails = sessionStorage.getItem('landPropertyDetails');

      try {
        const details = JSON.parse(savedDetails);
        if (details.title) document.getElementById('land-title').value = details.title;
        if (details.district) document.getElementById('district').value = details.district;
        if (details.upazila) document.getElementById('upazila').value = details.upazila;
        if (details.mouza) document.getElementById('mouza').value = details.mouza;
        if (details.khatian_no) document.getElementById('khatian-no').value = details.khatian_no;
        if (details.dag_no) document.getElementById('dag-no').value = details.dag_no;
        if (details.area) document.getElementById('area').value = details.area;
        if (details.land_type) document.getElementById('land-type').value = details.land_type;
        if (details.price) document.getElementById('price').value = details.price;
        
        // Negotiable Radio Button Restore
        if (details.negotiable) {
          const radioBtn = document.querySelector(`input[name="negotiable"][value="${details.negotiable}"]`);
          if (radioBtn) radioBtn.checked = true;
        }

        if (details.description && document.getElementById('description')) {
          document.getElementById('description').value = details.description;
        }
      } catch (e) {
        console.error('Error parsing cached details:', e);
      }
    }
  });

  async function handleNextStep(event) {
    event.preventDefault();

    const token = sessionStorage.getItem('token') || sessionStorage.getItem('authToken');

    if (!token) {
      alert('You are not logged in! Please log in to post a property.');
      window.location.href = 'login.html';
      return;
    }
    
    const submitBtn = document.getElementById('next-btn');
    const btnText = document.getElementById('btn-text');
    
    submitBtn.disabled = true;
    btnText.textContent = 'Saving...';

    const form = document.getElementById('property-form');
    const formData = new FormData(form);
    const propertyData = {};

    formData.forEach((value, key) => {
      propertyData[key] = value;
    });

    try {
      const response = await fetch(API_BASE, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(propertyData)
      });

      const result = await response.json();

      if (result.success) {
        sessionStorage.setItem('currentPropertyId', result.propertyId);
        sessionStorage.setItem('landPropertyDetails', JSON.stringify(propertyData));

        // Proceed to Step 2
        window.location.href = 'add_land2.html';
      } else {
        alert('Failed to save details: ' + (result.message || 'Server error'));
        submitBtn.disabled = false;
        btnText.textContent = 'Next Step';
      }
    } catch (err) {
      console.error('API Error:', err);
      alert('Could not connect to the backend server. Make sure it is running on https://digital-land-verification-platform-eight.vercel.app.');
      submitBtn.disabled = false;
      btnText.textContent = 'Next Step';
    }
  }
</script>
</body>
