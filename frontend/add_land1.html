          <!-- Property Input Form -->
          <form id="property-form" onsubmit="handleNextStep(event)">
            <div id="step-content-1">
              <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8">
                
                <!-- Column 1 -->
                <div class="space-y-5">
                  <div>
                    <label for="land-title" class="block text-xs font-bold text-gray-800 mb-1.5">Land Title</label>

                    <label for="district" class="block text-xs font-bold text-gray-800 mb-1.5">District</label>

                      </div>

                      </div>
                    </div>
                  </div>
                  <div>
                    <label for="mouza" class="block text-xs font-bold text-gray-800 mb-1.5">Area</label>
                    <div class="relative">
                      <input id="mouza" name="mouza" required class="w-full px-4 py-2.5 text-xs text-gray-700 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#0b6b32] focus:border-transparent outline-none transition-all appearance-none bg-white pr-8">
                       
                     
                    </div>
                  </div>
                </div>

                <!-- Column 2 -->
                <div class="space-y-5">
                  <div>
                    <label for="khatian-no" class="block text-xs font-bold text-gray-800 mb-1.5">Khatian No</label>
                    <input type="text" id="khatian-no" name="khatian_no" placeholder="Enter Khatian No" required class="w-full px-4 py-2.5 text-xs text-gray-800 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#0b6b32] focus:border-transparent outline-none transition-all placeholder-gray-400" />
                  </div>
                  <div>
                    <label for="dag-no" class="block text-xs font-bold text-gray-800 mb-1.5">Dag No</label>
                    <input type="text" id="dag-no" name="dag_no" placeholder="Enter Dag No" required class="w-full px-4 py-2.5 text-xs text-gray-800 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#0b6b32] focus:border-transparent outline-none transition-all placeholder-gray-400" />
                  </div>
                  <div>
                    <label for="area" class="block text-xs font-bold text-gray-800 mb-1.5">Katha</label>
                    <input type="number" step="0.01" id="area" name="area" placeholder="Enter Area (e.g. 10.5)" required class="w-full px-4 py-2.5 text-xs text-gray-800 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#0b6b32] focus:border-transparent outline-none transition-all placeholder-gray-400" />

                        <option value="Commercial">Commercial</option>
                        <option value="Agricultural">Agricultural</option>

  <input type="radio" id="negotiable-no" name="negotiable" value="No" class="ms-3">
  <label for="negotiable-no" class="text-xs font-bold text-gray-800">No</label>
</div>

            <!-- Navigation Actions -->

                type="submit" 
                id="next-btn" 
                class="inline-flex items-center gap-2 px-8 py-2.5 bg-[#0b6b32] hover:bg-[#095728] text-white font-bold text-xs rounded-xl transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-[#0b6b32] disabled:opacity-50"
              >
                <span id="btn-text">Next Step</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

  <script>
    const API_BASE = 'http://localhost:5000/api/properties';

    // Sidebar Mobile Controls
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    document.getElementById('open-sidebar-btn')?.addEventListener('click', () => { sidebar.classList.remove('-translate-x-full'); backdrop.classList.remove('hidden'); });
    document.getElementById('close-sidebar-btn')?.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); });
    backdrop?.addEventListener('click', () => { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); });

    // Populate existing values if coming back to Step 1
    window.addEventListener('DOMContentLoaded', () => {
      const savedDetails = sessionStorage.getItem('landPropertyDetails');
      if (savedDetails) {
        try {
          const details = JSON.parse(savedDetails);
          if (details.title) document.getElementById('land-title').value = details.title;
          if (details.district) document.getElementById('district').value = details.district;
          if (details.upazila) document.getElementById('upazila').value = details.upazila;
          if (details.mouza) document.getElementById('mouza').value = details.mouza;
          if (details.khatian_no) document.getElementById('khatian-no').value = details.khatian_no;
          if (details.dag_no) document.getElementById('dag-no').value = details.dag_no;
          if (details.area) document.getElementById('area').value = details.area;
          if (details.land_type) document.getElementById('land-type').value = details.land_type;
          if (details.description) document.getElementById('description').value = details.description;
        } catch (e) {
          console.error('Error parsing cached details:', e);
        }
      }
    });

    // Submit Step 1 to Backend API
    async function handleNextStep(event) {
      event.preventDefault();

  const token = localStorage.getItem('token') || localStorage.getItem('authToken');

  if (!token) {
    alert('You are not logged in! Please log in to post a property.');
    window.location.href = 'login.html'; // Adjust to your login page URL
    return;
  }
      
      const submitBtn = document.getElementById('next-btn');
      const btnText = document.getElementById('btn-text');
      
      submitBtn.disabled = true;
      btnText.textContent = 'Saving...';

      const form = document.getElementById('property-form');
      const formData = new FormData(form);
      const propertyData = {};

      formData.forEach((value, key) => {
        propertyData[key] = value;
      });

      try {
        const response = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
           },
          body: JSON.stringify(propertyData)
        });

        const result = await response.json();

        if (result.success) {
          // Store property ID for steps 2 & 3
          sessionStorage.setItem('currentPropertyId', result.propertyId);
          sessionStorage.setItem('landPropertyDetails', JSON.stringify(propertyData));

          // Proceed to Step 2
          window.location.href = 'add_land2.html';
        } else {
          alert('Failed to save details: ' + (result.message || 'Server error'));
          submitBtn.disabled = false;
          btnText.textContent = 'Next Step';
        }
      } catch (err) {
        console.error('API Error:', err);
        alert('Could not connect to the backend server. Make sure it is running on http://localhost:5000.');
        submitBtn.disabled = false;
        btnText.textContent = 'Next Step';
      }
    }
  </script>
