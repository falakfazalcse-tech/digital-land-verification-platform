  <!-- JavaScript Implementation -->
  <script>
    // Sidebar Controls for Mobile
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    const openSidebarBtn = document.getElementById('open-sidebar-btn');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');

    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      backdrop.classList.remove('hidden');
    }

    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      backdrop.classList.add('hidden');
    }

    openSidebarBtn?.addEventListener('click', openSidebar);
    closeSidebarBtn?.addEventListener('click', closeSidebar);
    backdrop?.addEventListener('click', closeSidebar);

    // Save Form Data to Session Storage and Navigate to Step 2
    function handleNextStep(event) {
      event.preventDefault();
      
      const form = document.getElementById('property-form');
      const formData = new FormData(form);
      const propertyDetails = {};

      formData.forEach((value, key) => {
        propertyDetails[key] = value;
      });

      // Persist step 1 form data across pages
      sessionStorage.setItem('landPropertyDetails', JSON.stringify(propertyDetails));

      // Direct connection redirect to add_land2.html page
      window.location.href = 'add_land2.html';
    }
  </script>
