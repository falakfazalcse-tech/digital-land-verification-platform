<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandDeal - Login</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#22C55E',
                        'dark-primary': '#16A34A',
                        'heading': '#111827',
                        'sub-text': '#4B5563',
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-white font-sans antialiased text-heading h-screen overflow-hidden">

    <div class="flex h-full w-full">
        <!-- Left Side: Login Form -->
        <div class="w-full lg:w-[45%] h-full flex flex-col justify-between p-6 sm:p-10 xl:p-12 overflow-y-auto lg:overflow-visible">
            <div class="max-w-md w-full mx-auto my-auto">
                
                <!-- Logo & Badge -->
                <div class="mb-5">
                    <h1 class="text-4xl font-black tracking-tight text-heading">LandDeal</h1>
                    <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-0.5 bg-green-50 text-dark-primary text-xs font-semibold rounded-full border border-dark-primary">
                        <span class="w-1.5 h-1.5 rounded-full bg-dark-primary" aria-hidden="true"></span>
                        Secure. Verified. Transparent
                    </div>
                </div>

                <!-- Page Header -->
                <h2 class="text-xl font-bold text-heading mb-1">Welcome Back</h2>
                <p class="text-xs text-sub-text mb-5">Login to your LandDeal account</p>

                <!-- General Alert Container -->
                <div id="general-error" class="hidden mb-3 p-2.5 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700 font-medium" role="alert" aria-live="assertive"></div>

                <!-- Role Selector Buttons -->
                <div class="flex gap-3 mb-5">
                    <button type="button" id="btn-user-role" onclick="selectRole('user')" class="flex-1 py-2.5 px-4 text-center text-xs sm:text-sm font-semibold rounded-lg bg-dark-primary text-white shadow-sm transition-all duration-200">
                        Buyer / Seller
                    </button>
                    <button type="button" id="btn-officer-role" onclick="selectRole('officer')" class="flex-1 py-2.5 px-4 text-center text-xs sm:text-sm font-semibold rounded-lg text-sub-text border border-gray-300 transition-all duration-200 hover:bg-green-50 hover:text-dark-primary hover:border-dark-primary active:scale-95">
                        Officer
                    </button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="space-y-4" novalidate>
                    <!-- Email / Mobile Input -->
                    <div>
                        <label for="email" class="block text-xs font-medium mb-1">Email Address / Mobile No <span class="text-red-500" aria-hidden="true">*</span></label>
                        <input type="text" id="email" name="email" placeholder="Enter your email/mobile no" required aria-required="true" aria-describedby="email-error" class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-xs sm:text-sm placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition" />
                        <p id="email-error" class="text-[11px] text-red-600 mt-1 hidden" role="alert"></p>
                    </div>

                    <!-- Password Input with Toggle -->
                    <div>
                        <label for="password" class="block text-xs font-medium mb-1">Password <span class="text-red-500" aria-hidden="true">*</span></label>
                        <div class="relative">
                            <input type="password" id="password" name="password" placeholder="Enter Your Password" required aria-required="true" aria-describedby="password-error" class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-xs sm:text-sm placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition pr-10" />
                            
                            <!-- Toggle Button -->
                            <button type="button" onclick="toggleVisibility('password', 'eye-icon-show', 'eye-icon-hide')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-gray-600 transition focus:outline-none" aria-label="Toggle password visibility">
                                <svg id="eye-icon-show" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.573 16.49 16.638 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <svg id="eye-icon-hide" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L9.878 9.878" />
                                </svg>
                            </button>
                        </div>
                        <p id="password-error" class="text-[11px] text-red-600 mt-1 hidden" role="alert"></p>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="w-full py-2.5 px-4 text-center text-xs sm:text-sm font-bold rounded-lg bg-primary text-white shadow-sm transition hover:bg-dark-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-1">
                        Login
                    </button>
                </form>



                <!-- Register Prompt -->
                <p class="text-xs sm:text-sm mt-4 text-center font-medium">
                    Don't have an account? 
                    <a href="register.html" class="text-dark-primary hover:text-primary font-semibold transition focus:outline-none focus:ring-1 focus:ring-primary">Register</a>
                </p>
            </div>
        </div>

        <!-- Right Side: Hero Cover Banner -->
        <div class="hidden lg:block lg:w-[55%] h-full relative">
            <img src="/assets/images/login_page_image.jpg" alt="Aerial view of green land plots" class="absolute inset-0 w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/35"></div>
        </div>
    </div>

    <!-- Forgot Password Modal Overlay -->
    <div id="forgotPasswordModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity duration-200">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative" onclick="event.stopPropagation()">
            <!-- Close Icon -->
            <button type="button" onclick="closeForgotModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition focus:outline-none">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>

            <h3 class="text-lg font-bold text-heading mb-1">Reset Your Password</h3>
            <p class="text-xs text-sub-text mb-4">Enter your registered email address and we'll send you instructions to reset your password.</p>

            <!-- Success Alert -->
            <div id="forgot-success" class="hidden mb-3 p-2.5 rounded-lg bg-green-50 border border-green-200 text-xs text-dark-primary font-medium"></div>
            <!-- Error Alert -->
            <div id="forgot-error" class="hidden mb-3 p-2.5 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700 font-medium"></div>

            <form id="forgotForm" class="space-y-3" novalidate>
                <div>
                    <label for="reset_email" class="block text-xs font-medium mb-1">Email Address <span class="text-red-500">*</span></label>
                    <input type="email" id="reset_email" placeholder="name@example.com" class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-xs sm:text-sm placeholder:text-gray-400 focus:ring-1 focus:ring-primary focus:border-primary transition" />
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeForgotModal()" class="flex-1 py-2 px-3 border border-gray-300 rounded-lg text-xs font-semibold text-sub-text hover:bg-gray-50 transition">
                        Cancel
                    </button>
                    <button type="submit" id="reset-submit-btn" class="flex-1 py-2 px-3 bg-primary text-white rounded-lg text-xs font-bold hover:bg-dark-primary transition shadow-sm">
                        Send Reset Link
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Section -->
    <script>
    // 1. Centralized API Config
    const API_BASE = 'https://digital-land-verification-platform-eight.vercel.app/api';
    let selectedRole = 'user'; // default role

    // Handle Role Switching
    function selectRole(role) {
        selectedRole = role;
        const btnUser = document.getElementById('btn-user-role');
        const btnOfficer = document.getElementById('btn-officer-role');

        const activeClasses = ['bg-dark-primary', 'text-white', 'shadow-sm'];
        const inactiveClasses = ['text-sub-text', 'border', 'border-gray-300', 'hover:bg-green-50', 'hover:text-dark-primary', 'hover:border-dark-primary'];

        if (role === 'user') {
            btnUser.classList.add(...activeClasses);
            btnUser.classList.remove(...inactiveClasses);

            btnOfficer.classList.remove(...activeClasses);
            btnOfficer.classList.add(...inactiveClasses);
        } else {
            btnOfficer.classList.add(...activeClasses);
            btnOfficer.classList.remove(...inactiveClasses);

            btnUser.classList.remove(...activeClasses);
            btnUser.classList.add(...inactiveClasses);
        }
    }

    // Toggle Password Visibility
    function toggleVisibility(inputId, showIconId, hideIconId) {
        const input = document.getElementById(inputId);
        const showIcon = document.getElementById(showIconId);
        const hideIcon = document.getElementById(hideIconId);

        if (input.type === 'password') {
            input.type = 'text';
            showIcon.classList.remove('hidden');
            hideIcon.classList.add('hidden');
        } else {
            input.type = 'password';
            showIcon.classList.add('hidden');
            hideIcon.classList.remove('hidden');
        }
    }

    // Forgot Password Modal Controls
    function openForgotModal() {
        const modal = document.getElementById('forgotPasswordModal');
        modal.classList.remove('hidden');
        document.getElementById('reset_email').value = document.getElementById('email').value.trim();
    }

    function closeForgotModal() {
        const modal = document.getElementById('forgotPasswordModal');
        modal.classList.add('hidden');
        document.getElementById('forgot-success').classList.add('hidden');
        document.getElementById('forgot-error').classList.add('hidden');
    }

    // Close modal when pressing Esc
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeForgotModal();
    });

    // Close modal on background click
    document.getElementById('forgotPasswordModal').addEventListener('click', closeForgotModal);

    // Validation UI Helpers
    function showError(inputId, message) {
        const input = document.getElementById(inputId);
        const errorEl = document.getElementById(`${inputId}-error`);
        
        if (input) {
            input.classList.add('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
            input.classList.remove('border-gray-300', 'focus:ring-primary', 'focus:border-primary');
            input.setAttribute('aria-invalid', 'true');
        }
        if (errorEl) {
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }
    }

    function clearError(inputId) {
        const input = document.getElementById(inputId);
        const errorEl = document.getElementById(`${inputId}-error`);
        
        if (input) {
            input.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
            input.classList.add('border-gray-300', 'focus:ring-primary', 'focus:border-primary');
            input.removeAttribute('aria-invalid');
        }
        if (errorEl) {
            errorEl.textContent = '';
            errorEl.classList.add('hidden');
        }
    }

    function clearAllErrors() {
        ['email', 'password'].forEach(clearError);
        const genError = document.getElementById('general-error');
        if (genError) {
            genError.textContent = '';
            genError.classList.add('hidden');
        }
    }

    ['email', 'password'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('input', () => clearError(id));
        }
    });

    // Forgot Password Form Submit Handler
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const resetEmail = document.getElementById('reset_email').value.trim();
        const successEl = document.getElementById('forgot-success');
        const errorEl = document.getElementById('forgot-error');
        const submitBtn = document.getElementById('reset-submit-btn');

        successEl.classList.add('hidden');
        errorEl.classList.add('hidden');

        if (!resetEmail) {
            errorEl.textContent = 'Please enter your email address.';
            errorEl.classList.remove('hidden');
            return;
        }

        try {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            const response = await fetch(`${API_BASE}/auth/forgot-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: resetEmail })
            });

            const data = await response.json();

            if (data.success) {
                successEl.textContent = data.message || 'Password reset link sent to your email!';
                successEl.classList.remove('hidden');
                document.getElementById('reset_email').value = '';
            } else {
                errorEl.textContent = data.message || 'Email not found or error sending reset link.';
                errorEl.classList.remove('hidden');
            }
        } catch (err) {
            console.error('Forgot Password Request Error:', err);
            errorEl.textContent = 'Unable to connect to the server. Please try again later.';
            errorEl.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Reset Link';
        }
    });

    // Login Submission Handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAllErrors();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const submitBtn = e.target.querySelector('button[type="submit"]');

        let hasError = false;

        if (!email) {
            showError('email', 'Email or Mobile number is required.');
            hasError = true;
        }

        if (!password) {
            showError('password', 'Password is required.');
            hasError = true;
        }

        if (hasError) return;

        try {
            // Disable button during login request
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            const response = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, role: selectedRole })
            });

            const data = await response.json();

            if (data.success) {
                // Save token & user info in sessionStorage
                sessionStorage.setItem('token', data.token);
                sessionStorage.setItem('user', JSON.stringify(data.user));

                const userRole = data.user.role ? data.user.role.toLowerCase() : selectedRole;
                if (userRole === 'officer') {
                    window.location.href = 'land_officer_dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                const genError = document.getElementById('general-error');
                if (genError) {
                    genError.textContent = data.message || 'Login failed. Please check your credentials.';
                    genError.classList.remove('hidden');
                }
            }
        } catch (err) {
            console.error('Login request failed:', err);
            const genError = document.getElementById('general-error');
            if (genError) {
                genError.textContent = 'Unable to connect to the backend server. Please check your connection.';
                genError.classList.remove('hidden');
            }
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
        }
    });
</script>
</body>
</html>
