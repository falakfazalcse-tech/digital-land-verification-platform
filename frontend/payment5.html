<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandDeal - Transaction History</title>
  <!-- Typography & Font Family -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#b8e3be] text-gray-900 min-h-screen p-4 md:p-6 lg:p-8">

<!-- Main Container -->
<div class="max-w-[1400px] mx-auto flex flex-col lg:flex-row gap-6 items-stretch">
  
  <!-- Sidebar Panel -->
  <aside class="w-full lg:w-64 bg-white rounded-2xl border border-gray-200 p-6 flex flex-col justify-between shrink-0">
    <div>
      <!-- Logo & Tagline -->
      <div class="mb-8">
        <a href="dashboard.html" class="block">
          <h1 class="text-2xl font-bold text-gray-900 tracking-tight">LandDeal</h1>
          <div class="mt-1 inline-block bg-green-50 border border-green-200 text-green-700 text-[10px] font-semibold px-2 py-0.5 rounded-full">
            Secure • Verified • Transparent
          </div>
        </a>
      </div>

      <!-- Navigation Menu -->
      <nav class="space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">
          <i data-lucide="layout-grid" class="w-5 h-5"></i> Dashboard
        </a>
        <a href="properties.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">
          <i data-lucide="home" class="w-5 h-5"></i> My Properties
        </a>
        <a href="add_land1.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">
          <i data-lucide="plus" class="w-5 h-5"></i> Add Land
        </a>
       
        <a href="payment5.html" class="flex items-center gap-3 px-3 py-2.5 bg-green-100 text-green-700 font-semibold rounded-xl text-sm transition-colors">
          <i data-lucide="receipt" class="w-5 h-5"></i> Transactions
        </a>
        <a href="profile.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">
          <i data-lucide="user" class="w-5 h-5"></i> Profile
        </a>
      </nav>
    </div>

    <!-- Logout -->
    <div class="pt-6 border-t border-gray-100">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2 text-gray-600 hover:text-gray-900 rounded-xl text-sm font-medium transition-colors">
        <i data-lucide="log-out" class="w-5 h-5"></i> Logout
      </a>
    </div>
  </aside>

  <!-- Main Content Panel -->
  <main class="flex-1 bg-white rounded-2xl border border-gray-200 p-6 lg:p-8 flex flex-col justify-between">
    <div>
      <!-- Top Bar -->
      <header class="flex items-center justify-between pb-6 border-b border-gray-200 mb-8">
        <h2 class="text-lg font-bold text-gray-900">Payment & Purchase History</h2>
        <div class="flex items-center gap-4">
          <button aria-label="Notifications" class="text-green-500 hover:text-green-600 relative p-1">
            <i data-lucide="bell" class="w-5 h-5 fill-current"></i>
          </button>
          <a href="profile.html" aria-label="User profile" class="w-8 h-8 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-gray-400 hover:text-gray-600">
            <i data-lucide="user" class="w-5 h-5"></i>
          </a>
        </div>
      </header>

      <!-- Section Title -->
      <div class="mb-6 flex justify-between items-center">
        <div>
          <h3 class="text-lg font-bold text-gray-900">Transactions</h3>
        </div>
        
      </div>

      <!-- Transactions Table -->
      <div class="overflow-x-auto border border-gray-200 rounded-2xl">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 border-b border-gray-200 text-gray-600 font-semibold">
            <tr>
              <th class="p-4">Transaction ID</th>
              <th class="p-4">Method</th>
              <th class="p-4">Amount</th>
              <th class="p-4">Date</th>
              <th class="p-4">Status</th>
            </tr>
          </thead>
          <tbody id="history-table-body" class="divide-y divide-gray-100">
            <tr><td colspan="5" class="p-6 text-center text-gray-500 font-medium">Loading history from MariaDB...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  lucide.createIcons();
  const API_BASE_URL = "https://digital-land-verification-platform-sand.vercel.app";

  document.addEventListener("DOMContentLoaded", async () => {
    const tbody = document.getElementById("history-table-body");

    try {
      const response = await fetch(`${API_BASE_URL}/api/v1/payments`);
      if (!response.ok) {
        throw new Error(`Server status ${response.status}`);
      }

      const result = await response.json();

      if (result.status === 'success' && result.data && result.data.length > 0) {
        tbody.innerHTML = result.data.map(item => `
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="p-4 font-semibold text-gray-900">${item.transaction_id}</td>
            <td class="p-4 uppercase font-semibold text-[#0b6b32]">${item.payment_method || 'BKASH'}</td>
            <td class="p-4 font-bold text-gray-900">৳ ${Number(item.amount).toLocaleString('en-IN')}</td>
            <td class="p-4 text-gray-500">${new Date(item.created_at || Date.now()).toLocaleDateString()}</td>
            <td class="p-4"><span class="px-2.5 py-1 bg-green-100 text-green-800 rounded-md text-xs font-bold">${(item.status || 'completed').toUpperCase()}</span></td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">No payment history found in MariaDB.</td></tr>`;
      }

    } catch (err) {
      console.error("Failed to fetch payments:", err);
      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="p-6 text-center text-red-500 font-medium">
            Failed to load data from backend server (${API_BASE_URL}). Ensure node server is running.
          </td>
        </tr>`;
    }
  });
</script>
</body>
</html>
