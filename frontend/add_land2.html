<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandDeal - Upload Documents</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#f2f9f3] text-gray-900 antialiased min-h-screen">

  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden transition-opacity"></div>

  <div class="flex flex-col lg:flex-row min-h-screen p-3 md:p-6 gap-6 max-w-[1600px] mx-auto relative">

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed lg:static top-0 left-0 h-full lg:h-auto w-64 bg-white rounded-r-3xl lg:rounded-3xl p-6 flex flex-col justify-between shadow-lg lg:shadow-sm flex-shrink-0 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
      <div>
        <div class="mb-8 flex items-center justify-between">
          <a href="#" class="inline-block focus:outline-none focus:ring-2 focus:ring-[#0b6b32] rounded-md">
            <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">LandDeal</h1>
            <span class="text-[10px] font-semibold text-[#0b6b32] tracking-wider bg-green-100 px-2.5 py-0.5 rounded-full inline-block mt-1">
              Secure . Verified . Transparent
            </span>
          </a>
          <button id="close-sidebar-btn" class="lg:hidden p-1 text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <nav aria-label="Main Navigation">
          <ul class="space-y-1.5">
            <li><a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-[#0b6b32] font-medium rounded-xl text-sm transition-colors"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg><span>Dashboard</span></a></li>
            <li><a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-[#0b6b32] font-medium rounded-xl text-sm transition-colors"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><span>Browse Land</span></a></li>
            <li><a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-[#0b6b32] font-medium rounded-xl text-sm transition-colors"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>My Properties</span></a></li>
            <li><a href="#" aria-current="page" class="flex items-center gap-3 px-4 py-3 bg-green-100 text-[#0b6b32] font-semibold rounded-xl text-sm transition-colors"><svg class="w-5 h-5 text-[#0b6b32]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg><span>Add Land</span></a></li>
            <li><a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-[#0b6b32] font-medium rounded-xl text-sm transition-colors"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg><span>Messages</span></a></li>
            <li><a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-[#0b6b32] font-medium rounded-xl text-sm transition-colors"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span>Transactions</span></a></li>
            <li><a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-[#0b6b32] font-medium rounded-xl text-sm transition-colors"><svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span>Profile</span></a></li>
          </ul>
        </nav>
      </div>

      <div class="pt-6 border-t border-gray-100 mt-6 lg:mt-0">
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-red-50 hover:text-red-700 font-medium rounded-xl text-sm transition-colors">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span>Logout</span>
        </a>
      </div>
    </aside>

    <!-- Main Content Panel -->
    <main class="flex-1 bg-white rounded-3xl p-4 sm:p-6 md:p-8 shadow-sm flex flex-col justify-between">
      <div>
        <!-- Header -->
        <header class="flex items-center justify-between pb-5 border-b border-gray-200 mb-8">
          <div class="flex items-center gap-3">
            <button id="open-sidebar-btn" class="lg:hidden p-2 rounded-xl text-gray-700 hover:bg-gray-100"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            <h2 class="text-xl font-bold text-gray-900 tracking-tight">Add Your Land</h2>
          </div>
          <div class="flex items-center gap-4">
            <button type="button" class="p-2 text-[#0b6b32] hover:bg-green-50 rounded-full"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 22a2.98 2.98 0 002.818-2H9.182A2.98 2.98 0 0012 22zm7-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C8.64 5.36 7 7.92 7 11v5l-2 2v1h14v-1l-2-2z"/></svg></button>
            <button type="button" class="text-gray-300 hover:text-gray-500 rounded-full"><svg class="w-9 h-9" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg></button>
          </div>
        </header>

        <!-- Stepper -->
        <div class="max-w-xl mx-auto my-6 px-4">
          <div class="relative flex items-start justify-between">
            <div class="absolute top-[22px] left-0 right-0 h-[1.5px] bg-[#0b6b32] -translate-y-1/2 z-0"></div>

            <!-- Step 1 Completed -->
            <a href="step1-property-details.html" class="relative z-10 flex flex-col items-center">
              <div class="w-11 h-11 rounded-full bg-[#0b6b32] text-white flex items-center justify-center text-base shadow-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
              </div>
              <span class="mt-2 text-xs font-bold text-[#0b6b32] text-center">Property Details</span>
            </a>

            <!-- Step 2 Active -->
            <div class="relative z-10 flex flex-col items-center">
              <div class="w-11 h-11 rounded-full bg-[#0b6b32] text-white font-bold flex items-center justify-center text-base shadow-sm">
                2
              </div>
              <span class="mt-2 text-xs font-bold text-[#0b6b32] text-center">Documents</span>
            </div>

            <!-- Step 3 Upcoming -->
            <div class="relative z-10 flex flex-col items-center">
              <div class="w-11 h-11 rounded-full bg-white border-2 border-gray-400 text-gray-700 font-semibold flex items-center justify-center text-base">
                3
              </div>
              <span class="mt-2 text-xs font-semibold text-gray-700 text-center">Preview</span>
            </div>
          </div>
        </div>

        <!-- Document Upload Grid Card -->
        <div class="border border-gray-200 rounded-3xl p-6 sm:p-8 mt-12 bg-white shadow-xs">
          <h3 class="text-xl font-bold text-gray-900 mb-8 tracking-tight">Upload Documents</h3>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Box 1: Deed / Sales Deed -->
            <label class="border-2 border-dashed border-gray-300 hover:border-[#0b6b32] rounded-2xl p-6 flex flex-col items-center justify-center text-center cursor-pointer transition-colors group bg-white">
              <div class="w-12 h-12 mb-3 flex items-center justify-center">
                <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              </div>
              <span class="text-xs font-bold text-gray-800 mb-1">Deed / Sales Deed</span>
              <span class="text-[11px] text-gray-400">Drag & drop or<br><span class="text-gray-500">click to upload</span></span>
              <input type="file" class="hidden" />
            </label>

            <!-- Box 2: Tax Receipt -->
            <label class="border-2 border-dashed border-gray-300 hover:border-[#0b6b32] rounded-2xl p-6 flex flex-col items-center justify-center text-center cursor-pointer transition-colors group bg-white">
              <div class="w-12 h-12 mb-3 flex items-center justify-center">
                <svg class="w-10 h-10 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
              </div>
              <span class="text-xs font-bold text-gray-800 mb-1">Tax Receipt</span>
              <span class="text-[11px] text-gray-400">Drag & drop or<br><span class="text-gray-500">click to upload</span></span>
              <input type="file" class="hidden" />
            </label>

            <!-- Box 3: National ID -->
            <label class="border-2 border-dashed border-gray-300 hover:border-[#0b6b32] rounded-2xl p-6 flex flex-col items-center justify-center text-center cursor-pointer transition-colors group bg-white">
              <div class="w-12 h-12 mb-3 flex items-center justify-center">
                <svg class="w-10 h-10 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 012-2h2a2 2 0 012 2v1m-4 0h4"/></svg>
              </div>
              <span class="text-xs font-bold text-gray-800 mb-1">National ID</span>
              <span class="text-[11px] text-gray-400">Drag & drop or<br><span class="text-gray-500">click to upload</span></span>
              <input type="file" class="hidden" />
            </label>

            <!-- Box 4: Mutation Certificate -->
            <label class="border-2 border-dashed border-gray-300 hover:border-[#0b6b32] rounded-2xl p-6 flex flex-col items-center justify-center text-center cursor-pointer transition-colors group bg-white">
              <div class="w-12 h-12 mb-3 flex items-center justify-center">
                <svg class="w-10 h-10 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
              </div>
              <span class="text-xs font-bold text-gray-800 mb-1">Mutation Certificate</span>
              <span class="text-[11px] text-gray-400">Drag & drop or<br><span class="text-gray-500">click to upload</span></span>
              <input type="file" class="hidden" />
            </label>

            <!-- Box 5: Recent Survey -->
            <label class="border-2 border-dashed border-gray-300 hover:border-[#0b6b32] rounded-2xl p-6 flex flex-col items-center justify-center text-center cursor-pointer transition-colors group bg-white">
              <div class="w-12 h-12 mb-3 flex items-center justify-center">
                <svg class="w-10 h-10 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
              </div>
              <span class="text-xs font-bold text-gray-800 mb-1">Recent Survey</span>
              <span class="text-[11px] text-gray-400">Drag & drop or<br><span class="text-gray-500">click to upload</span></span>
              <input type="file" class="hidden" />
            </label>

            <!-- Box 6: Land Images -->
            <label class="border-2 border-dashed border-gray-300 hover:border-[#0b6b32] rounded-2xl p-6 flex flex-col items-center justify-center text-center cursor-pointer transition-colors group bg-white">
              <div class="w-12 h-12 mb-3 flex items-center justify-center">
                <svg class="w-10 h-10 text-[#0b6b32]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              </div>
              <span class="text-xs font-bold text-gray-800 mb-1">Land Images</span>
              <span class="text-[11px] text-gray-400">Drag & drop or<br><span class="text-gray-500">click to upload</span></span>
              <input type="file" multiple class="hidden" />
            </label>

          </div>

          <!-- Bottom Action Buttons -->
          <div class="mt-12 flex justify-between items-center">
            <a href="add_land2.html" class="inline-flex items-center gap-2 px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-xs rounded-xl transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              <span>Back</span>
            </a>

            <a href="add_land3.html" class="inline-flex items-center gap-2 px-6 py-2.5 bg-[#0b6b32] hover:bg-[#095728] text-white font-bold text-xs rounded-xl transition-colors shadow-sm">
              <span>Next</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </a>
          </div>
        </div>

      </div>
    </main>

  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    document.getElementById('open-sidebar-btn').onclick = () => { sidebar.classList.remove('-translate-x-full'); backdrop.classList.remove('hidden'); };
    document.getElementById('close-sidebar-btn').onclick = () => { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); };
    backdrop.onclick = () => { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); };
  </script>
</body>
</html>
