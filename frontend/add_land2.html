 <script>
  
function toggleProfileDropdown(event) {
  event.stopPropagation();
  const dropdown = document.getElementById('profile-dropdown');
  dropdown.classList.toggle('hidden');
}

document.addEventListener('click', (e) => {
  const container = document.getElementById('profile-dropdown-container');
  const dropdown = document.getElementById('profile-dropdown');
  if (container && !container.contains(e.target)) {
    dropdown.classList.add('hidden');
  }
});



const BACKEND_URL = 'digital-land-verification-platform-sand.vercel.app'; 

async function loadUserProfile() {
  const avatarRing = document.getElementById('profile-avatar-ring');
  
  const token = sessionStorage.getItem('token');
  const defaultDarkUserIcon = `
    <svg class="w-6 h-6 text-slate-300" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
    </svg>
  `;

  let user = null;

  const userDataStr = sessionStorage.getItem('user');

  if (userDataStr) {
    try {
      user = JSON.parse(userDataStr);
    } catch (e) {
      console.error('Error parsing session user data:', e);
    }
  }

  if (!user && token) {
    try {
      const response = await fetch(`${BACKEND_URL}/api/auth/profile`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
      const result = await response.json();
      
      if (result.success) {
        user = result.user || result.data;
        if (user) {
          sessionStorage.setItem('user', JSON.stringify(user));
        }
      }
    } catch (err) {
      console.error('Error fetching profile from API:', err);
    }
  }

  const userNameEl = document.getElementById('user_name');
  const dropdownNameEl = document.getElementById('dropdown-user-name');
  const dropdownEmailEl = document.getElementById('dropdown-user-email');

  if (user) {
    const name = user.full_name || user.name || user.user_name || user.username || user.first_name || 'User';
    const email = user.email || 'user@landdeal.com';

    if (userNameEl) userNameEl.textContent = name;
    if (dropdownNameEl) dropdownNameEl.textContent = name;
    if (dropdownEmailEl) dropdownEmailEl.textContent = email;

    const userPic = user.profile_pic || user.avatar || user.image || user.profile_image;

    if (userPic && avatarRing) {
      let imgPath = userPic;
      if (!userPic.startsWith('http://') && !userPic.startsWith('https://')) {
        const cleanPath = userPic.startsWith('/') ? userPic : `/${userPic}`;
        imgPath = `${BACKEND_URL}${cleanPath.includes('/uploads') ? cleanPath : '/uploads/documents' + cleanPath}`;
      }

      avatarRing.innerHTML = `
        <img 
          src="${imgPath}" 
          alt="Profile" 
          class="w-full h-full object-cover rounded-full" 
          onerror="this.onerror=null; this.parentElement.innerHTML=\`${defaultDarkUserIcon.replace(/'/g, "\\'")}\`;" 
        />
      `;
    } else if (avatarRing) {
      avatarRing.innerHTML = defaultDarkUserIcon;
    }
  } else {
    if (userNameEl) userNameEl.textContent = 'Guest';
    if (dropdownNameEl) dropdownNameEl.textContent = 'Guest User';
    if (dropdownEmailEl) dropdownEmailEl.textContent = 'Not logged in';
    if (avatarRing) avatarRing.innerHTML = defaultDarkUserIcon;
  }
}

  document.addEventListener("DOMContentLoaded", () => {
    // Validate Session Property ID
    const propertyId = sessionStorage.getItem("currentPropertyId");
    if (!propertyId) {
      alert("Property ID not found. Please complete Step 1 first.");
      window.location.href = "add_land1.html";
      return;
    }

    // Sidebar Toggle Logic
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    if (document.getElementById('open-sidebar-btn')) {
      document.getElementById('open-sidebar-btn').onclick = () => { sidebar.classList.remove('-translate-x-full'); backdrop.classList.remove('hidden'); };
    }
    if (document.getElementById('close-sidebar-btn')) {
      document.getElementById('close-sidebar-btn').onclick = () => { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); };
    }
    backdrop.onclick = () => { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); };

    // Toggle Groups
    document.querySelectorAll('.toggle-group').forEach(group => {
      const buttons = group.querySelectorAll('.toggle-btn');
      const hiddenInput = group.querySelector('input[type="hidden"]');

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => {
            b.classList.remove('bg-white', 'text-gray-900', 'shadow-2xs');
            b.classList.add('text-gray-500');
          });
          btn.classList.add('bg-white', 'text-gray-900', 'shadow-2xs');
          btn.classList.remove('text-gray-500');
          hiddenInput.value = btn.getAttribute('data-val');
        });
      });
    });

    // Form Elements
    const form = document.getElementById('upload-form');
    const fileInputs = document.querySelectorAll('.file-input');
    const uploadCards = document.querySelectorAll('.upload-card');
    const statusMsg = document.getElementById('status-message');
    const nextBtn = document.getElementById('next-btn');

    // Update card interface on file selection
    const updateCardUI = (input, files) => {
      const card = input.closest('.upload-card');
      const statusText = card.querySelector('.file-status');

      if (files && files.length > 0) {
        card.classList.add('border-[#0b6b32]', 'bg-green-50/50');
        card.classList.remove('border-gray-300');

        if (input.multiple) {
          statusText.innerHTML = `<span class="text-[#0b6b32] font-semibold">${files.length} images selected</span>`;
        } else {
          const fileName = files[0].name;
          const truncated = fileName.length > 18 ? fileName.substring(0, 15) + '...' : fileName;
          statusText.innerHTML = `<span class="text-[#0b6b32] font-semibold">${truncated}</span>`;
        }
      }
    };

    // File input change listener
    fileInputs.forEach(input => {
      input.addEventListener('change', (e) => {
        updateCardUI(e.target, e.target.files);
      });
    });

    // Drag and Drop Visual Interactions
    uploadCards.forEach(card => {
      ['dragenter', 'dragover'].forEach(eventName => {
        card.addEventListener(eventName, (e) => {
          e.preventDefault();
          card.classList.add('border-[#0b6b32]', 'bg-green-50/30');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        card.addEventListener(eventName, (e) => {
          e.preventDefault();
          card.classList.remove('bg-green-50/30');
        }, false);
      });

      card.addEventListener('drop', (e) => {
        const input = card.querySelector('.file-input');
        if (e.dataTransfer.files.length > 0) {
          input.files = e.dataTransfer.files;
          updateCardUI(input, e.dataTransfer.files);
        }
      });
    });

    // Form Submission Handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData();
      formData.append('property_id', propertyId);

      fileInputs.forEach(input => {
        if (input.files.length > 0) {
          if (input.multiple) {
            for (let i = 0; i < input.files.length; i++) {
              formData.append(input.name, input.files[i]);
            }
          } else {
            formData.append(input.name, input.files[0]);
          }
        }
      });

      nextBtn.disabled = true;
      nextBtn.innerHTML = `<span>Saving...</span>`;

      try {
        const response = await fetch('digital-land-verification-platform-sand.vercel.app/api/properties/documents', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = 'add_land3.html';
        } else {
          showStatus(data.message || 'Failed to upload documents.', 'bg-red-100 text-red-700');
          resetButton();
        }
      } catch (error) {
        console.error('Network Error:', error);
        window.location.href = 'add_land3.html';
      }
    });

    function showStatus(msg, classes) {
      statusMsg.className = `mt-6 p-4 rounded-xl text-sm font-semibold ${classes}`;
      statusMsg.innerText = msg;
      statusMsg.classList.remove('hidden');
    }

    function resetButton() {
      nextBtn.disabled = false;
      nextBtn.innerHTML = `<span>Next</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>`;
    }
  });
</script>
</body>
