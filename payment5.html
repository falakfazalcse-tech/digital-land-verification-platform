<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandDeal - My Payments</title>
  
  <!-- Typography & Font Family -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-[#f2f9f3] text-gray-900 min-h-screen p-4 md:p-6 lg:p-8">

  <!-- Main Container -->
  <div class="max-w-[1400px] mx-auto flex flex-col lg:flex-row gap-6 items-stretch">
    
    <!-- Sidebar Panel -->
    <aside class="w-full lg:w-64 bg-white rounded-2xl border border-gray-200 p-6 flex flex-col justify-between shrink-0">
      <div>
        <!-- Logo & Tagline -->
        <div class="mb-8">
          <h1 class="text-2xl font-bold text-gray-900 tracking-tight">LandDeal</h1>
          <div class="mt-1 inline-block bg-green-50 border border-green-200 text-green-700 text-[10px] font-semibold px-2 py-0.5 rounded-full">
            Secure • Verified • Transparent
          </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="space-y-1">
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">
            <i data-lucide="layout-grid" class="w-5 h-5"></i>
            Dashboard
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">
            <i data-lucide="search" class="w-5 h-5"></i>
            Browse Land
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">
            <i data-lucide="home" class="w-5 h-5"></i>
            My Properties
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">
            <i data-lucide="plus" class="w-5 h-5"></i>
            Add Land
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">
            <i data-lucide="mail" class="w-5 h-5"></i>
            Messages
          </a>
          <!-- Active Nav Item -->
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 bg-green-100 text-green-700 font-semibold rounded-xl text-sm transition-colors">
            <i data-lucide="receipt" class="w-5 h-5"></i>
            Transactions
          </a>
          <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">
            <i data-lucide="user" class="w-5 h-5"></i>
            Profile
          </a>
        </nav>
      </div>

      <!-- Logout -->
      <div class="pt-6 border-t border-gray-100">
        <a href="#" class="flex items-center gap-3 px-3 py-2 text-gray-600 hover:text-gray-900 rounded-xl text-sm font-medium transition-colors">
          <i data-lucide="log-out" class="w-5 h-5"></i>
          Logout
        </a>
      </div>
    </aside>

    <!-- Main Content Panel -->
    <main class="flex-1 bg-white rounded-2xl border border-gray-200 p-6 lg:p-8 flex flex-col justify-between">
      
      <div>
        <!-- Top Bar -->
        <header class="flex items-center justify-between pb-6 mb-4">
          <div>
            <h2 class="text-xl font-bold text-gray-900">My Payments</h2>
            <p class="text-xs text-gray-600 mt-1">View your all payments and transaction history.</p>
          </div>
          <div class="flex items-center gap-4">
            <button aria-label="Notifications" class="text-green-500 hover:text-green-600 relative p-1">
              <i data-lucide="bell" class="w-5 h-5 fill-current"></i>
            </button>
            <button aria-label="User profile" class="w-8 h-8 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-gray-400">
              <i data-lucide="user" class="w-5 h-5"></i>
            </button>
          </div>
        </header>

        <!-- Category Tabs -->
        <div class="border-b border-gray-200 mb-6">
          <nav class="flex gap-8 overflow-x-auto text-xs font-semibold" id="status-tabs">
            <button data-status="all" class="tab-btn pb-3 border-b-2 border-[#0b6b32] text-[#0b6b32] whitespace-nowrap">
              All Transactions
            </button>
            <button data-status="Pending" class="tab-btn pb-3 border-b-2 border-transparent text-gray-600 hover:text-gray-900 whitespace-nowrap">
              Pending
            </button>
            <button data-status="Completed" class="tab-btn pb-3 border-b-2 border-transparent text-gray-600 hover:text-gray-900 whitespace-nowrap">
              Completed
            </button>
            <button data-status="Failed" class="tab-btn pb-3 border-b-2 border-transparent text-gray-600 hover:text-gray-900 whitespace-nowrap">
              Failed
            </button>
            <button data-status="Refunded" class="tab-btn pb-3 border-b-2 border-transparent text-gray-600 hover:text-gray-900 whitespace-nowrap">
              Refunded
            </button>
          </nav>
        </div>

        <!-- Transactions Table -->
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse min-w-[700px]">
            <thead>
              <tr class="bg-gray-100/80 text-gray-700 text-xs font-bold">
                <th class="py-3 px-4 rounded-l-lg">Transaction ID</th>
                <th class="py-3 px-4">Property</th>
                <th class="py-3 px-4">Amount</th>
                <th class="py-3 px-4">Method</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4">Date</th>
                <th class="py-3 px-4 text-center rounded-r-lg">Action</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-gray-100 text-xs">
              <!-- Dynamically Populated via JS -->
            </tbody>
          </table>
        </div>

      </div>

      <!-- Pagination Section -->
      <div class="mt-8 pt-4 border-t border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
        <p class="text-gray-600 font-medium" id="pagination-info">
          Showing <span class="font-bold text-gray-900" id="showing-start">1</span> to <span class="font-bold text-gray-900" id="showing-end">5</span> of <span class="font-bold text-gray-900" id="total-count">0</span> results
        </p>
        
        <!-- Page Control Buttons -->
        <div class="flex items-center gap-1.5" id="pagination-buttons">
          <!-- Dynamically Populated via JS -->
        </div>
      </div>

    </main>

  </div>

  <!-- JavaScript logic -->
  <script>
    // Sample Transaction Dataset
    const transactions = [
      { id: 'TXN-2026-0001352', title: '12.5 Katha Residential Plot', location: 'Bashundhara, Dhaka', amount: '৳ 28,25,000', method: 'bKash', methodColor: '#e2136e', status: 'Completed', date: '02 June 2026', time: '11:30 AM' },
      { id: 'TXN-2026-0001342', title: '25 Katha Agricultural Land', location: 'Keraniganj, Dhaka', amount: '৳ 58,25,000', method: 'bKash', methodColor: '#e2136e', status: 'Completed', date: '03 June 2026', time: '11:30 AM' },
      { id: 'TXN-2026-0001332', title: '10 Katha Commercial Plot', location: 'Dhanmondi, Dhaka', amount: '৳ 18,25,000', method: 'Nagad', methodColor: '#f7941d', status: 'Completed', date: '04 June 2026', time: '11:30 AM' },
      { id: 'TXN-2026-0001322', title: '10 Katha Residential Plot', location: 'Uttara, Dhaka', amount: '৳ 18,25,000', method: 'Nagad', methodColor: '#f7941d', status: 'Pending', date: '05 June 2026', time: '11:30 AM' },
      { id: 'TXN-2026-0001312', title: '5 Katha Residential Plot', location: 'Wari, Dhaka', amount: '৳ 8,25,000', method: 'bKash', methodColor: '#e2136e', status: 'Failed', date: '06 June 2026', time: '11:30 AM' },
      { id: 'TXN-2026-0001302', title: '8 Katha Corner Plot', location: 'Purbachal, Dhaka', amount: '৳ 15,50,000', method: 'Nagad', methodColor: '#f7941d', status: 'Completed', date: '07 June 2026', time: '02:15 PM' },
      { id: 'TXN-2026-0001292', title: '15 Katha Industrial Land', location: 'Savar, Dhaka', amount: '৳ 42,00,000', method: 'bKash', methodColor: '#e2136e', status: 'Pending', date: '08 June 2026', time: '04:20 PM' },
      { id: 'TXN-2026-0001282', title: '6 Katha Residential Land', location: 'Mirpur, Dhaka', amount: '৳ 12,00,000', method: 'Nagad', methodColor: '#f7941d', status: 'Refunded', date: '09 June 2026', time: '10:00 AM' },
      { id: 'TXN-2026-0001272', title: '20 Katha Commercial Space', location: 'Gulshan, Dhaka', amount: '৳ 95,00,000', method: 'bKash', methodColor: '#e2136e', status: 'Completed', date: '10 June 2026', time: '01:45 PM' },
      { id: 'TXN-2026-0001262', title: '4 Katha Lake View Plot', location: 'Aftabnagar, Dhaka', amount: '৳ 9,80,000', method: 'Nagad', methodColor: '#f7941d', status: 'Pending', date: '11 June 2026', time: '05:30 PM' },
      { id: 'TXN-2026-0001252', title: '3 Katha Mini Plot', location: 'Badda, Dhaka', amount: '৳ 6,50,000', method: 'bKash', methodColor: '#e2136e', status: 'Failed', date: '12 June 2026', time: '12:10 PM' },
      { id: 'TXN-2026-0001242', title: '50 Katha Farmhouse Land', location: 'Gazipur, Dhaka', amount: '৳ 1,20,00,000', method: 'Nagad', methodColor: '#f7941d', status: 'Refunded', date: '13 June 2026', time: '09:00 AM' }
    ];

    let currentFilter = 'all';
    let currentPage = 1;
    const itemsPerPage = 5;

    function getFilteredData() {
      if (currentFilter === 'all') return transactions;
      return transactions.filter(item => item.status.toLowerCase() === currentFilter.toLowerCase());
    }

    function renderStatusBadge(status) {
      if (status === 'Completed') {
        return `<span class="inline-flex items-center gap-1 bg-green-100 text-green-700 text-[11px] font-semibold px-2.5 py-1 rounded-full">
                  <i data-lucide="check-circle" class="w-3 h-3"></i>
                  Completed
                </span>`;
      } else if (status === 'Pending') {
        return `<span class="inline-flex items-center gap-1 bg-amber-100 text-amber-700 text-[11px] font-semibold px-2.5 py-1 rounded-full">
                  <i data-lucide="clock" class="w-3 h-3"></i>
                  Pending
                </span>`;
      } else if (status === 'Failed') {
        return `<span class="inline-flex items-center gap-1 bg-rose-100 text-rose-700 text-[11px] font-semibold px-2.5 py-1 rounded-full">
                  <i data-lucide="x-circle" class="w-3 h-3"></i>
                  Failed
                </span>`;
      } else {
        return `<span class="inline-flex items-center gap-1 bg-gray-100 text-gray-700 text-[11px] font-semibold px-2.5 py-1 rounded-full">
                  <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                  Refunded
                </span>`;
      }
    }

    function renderTable() {
      const filteredData = getFilteredData();
      const totalItems = filteredData.length;
      const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

      if (currentPage > totalPages) currentPage = totalPages;

      const startIdx = (currentPage - 1) * itemsPerPage;
      const endIdx = Math.min(startIdx + itemsPerPage, totalItems);
      const pageData = filteredData.slice(startIdx, endIdx);

      const tbody = document.getElementById('table-body');
      
      if (pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-500 font-medium">No transactions found for this category.</td></tr>`;
      } else {
        tbody.innerHTML = pageData.map(item => `
          <tr class="hover:bg-gray-50/50 transition-colors">
            <td class="py-4 px-4 font-semibold text-gray-900">${item.id}</td>
            <td class="py-4 px-4">
              <p class="font-semibold text-gray-900">${item.title}</p>
              <p class="text-[11px] text-gray-500">${item.location}</p>
            </td>
            <td class="py-4 px-4 font-bold text-gray-900">${item.amount}</td>
            <td class="py-4 px-4">
              <span class="font-bold" style="color: ${item.methodColor}">${item.method}</span>
            </td>
            <td class="py-4 px-4">
              ${renderStatusBadge(item.status)}
            </td>
            <td class="py-4 px-4 text-gray-600">
              <p>${item.date}</p>
              <p class="text-[11px] text-gray-400">${item.time}</p>
            </td>
            <td class="py-4 px-4 text-center">
              <button onclick="alert('Viewing transaction details for ${item.id}')" class="px-3 py-1 border border-gray-800 text-gray-900 text-xs font-semibold rounded hover:bg-gray-50 transition-colors">
                View
              </button>
            </td>
          </tr>
        `).join('');
      }

      // Update Pagination Info Text
      document.getElementById('showing-start').innerText = totalItems === 0 ? 0 : startIdx + 1;
      document.getElementById('showing-end').innerText = endIdx;
      document.getElementById('total-count').innerText = totalItems;

      renderPagination(totalPages);
      lucide.createIcons();
    }

    function renderPagination(totalPages) {
      const container = document.getElementById('pagination-buttons');
      let html = '';

      // Prev Button
      html += `
        <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-gray-300 cursor-not-allowed"' : 'class="w-8 h-8 rounded-lg border border-gray-300 flex items-center justify-center text-gray-600 hover:bg-gray-50 transition-colors"'}>
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
      `;

      // Page Numbers
      for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
          html += `
            <button onclick="changePage(${i})" class="w-8 h-8 rounded-lg border border-gray-900 bg-white font-bold text-gray-900 flex items-center justify-center shadow-sm">
              ${i}
            </button>
          `;
        } else {
          html += `
            <button onclick="changePage(${i})" class="w-8 h-8 rounded-lg border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 flex items-center justify-center transition-colors">
              ${i}
            </button>
          `;
        }
      }

      // Next Button
      html += `
        <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages || totalPages === 0 ? 'disabled class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-gray-300 cursor-not-allowed"' : 'class="w-8 h-8 rounded-lg border border-gray-300 flex items-center justify-center text-gray-600 hover:bg-gray-50 transition-colors"'}>
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      `;

      container.innerHTML = html;
    }

    function changePage(page) {
      const filteredData = getFilteredData();
      const totalPages = Math.ceil(filteredData.length / itemsPerPage);
      if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderTable();
      }
    }

    // Setup Event Listeners for Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        // Remove active class from all tabs
        document.querySelectorAll('.tab-btn').forEach(t => {
          t.classList.remove('border-[#0b6b32]', 'text-[#0b6b32]');
          t.classList.add('border-transparent', 'text-gray-600');
        });

        // Add active class to clicked tab
        const activeTab = e.currentTarget;
        activeTab.classList.remove('border-transparent', 'text-gray-600');
        activeTab.classList.add('border-[#0b6b32]', 'text-[#0b6b32]');

        // Update state
        currentFilter = activeTab.getAttribute('data-status');
        currentPage = 1;
        renderTable();
      });
    });

    // Initial render
    renderTable();
  </script>
</body>
</html>
